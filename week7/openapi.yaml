openapi: 3.0.3
info:
  title: Product API
  version: 1.0.0
  description: |
    OpenAPI specification for Product CRUD.
    This API is designed for a MongoDB backend where product IDs are ObjectId strings.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
tags:
  - name: Products
    description: Manage product resources
paths:
  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by product name (contains)
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category
        - in: query
          name: minPrice
          schema:
            type: number
            format: float
            minimum: 0
          description: Minimum product price
        - in: query
          name: maxPrice
          schema:
            type: number
            format: float
            minimum: 0
          description: Maximum product price
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [name, price, stock, createdAt, updatedAt]
            default: createdAt
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: Product list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                sample:
                  value:
                    data:
                      - _id: "6613d7d94af0df2a8e9ed201"
                        name: "Wireless Mouse"
                        description: "2.4GHz ergonomic mouse"
                        price: 19.99
                        stock: 50
                        category: "Accessories"
                        isActive: true
                        tags: ["mouse", "wireless"]
                        createdAt: "2026-04-09T08:10:00.000Z"
                        updatedAt: "2026-04-09T08:10:00.000Z"
                    pagination:
                      page: 1
                      limit: 10
                      totalItems: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            examples:
              sample:
                value:
                  name: "Mechanical Keyboard"
                  description: "Hot-swappable keyboard"
                  price: 89.5
                  stock: 30
                  category: "Peripherals"
                  isActive: true
                  tags: ["keyboard", "mechanical"]
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'

  /products/{productId}:
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        description: MongoDB ObjectId of the product
    get:
      tags: [Products]
      summary: Get product by ID
      operationId: getProductById
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Replace product by ID
      operationId: replaceProductById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: Product replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      summary: Update product by ID (partial)
      operationId: updateProductById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Delete product by ID
      operationId: deleteProductById
      responses:
        '204':
          description: Product deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Product:
      type: object
      required:
        - _id
        - name
        - price
        - stock
        - category
        - isActive
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: MongoDB ObjectId
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean
          default: true
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 30
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required:
        - name
        - price
        - stock
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean
          default: true
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 30
      additionalProperties: false

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 30
      additionalProperties: false

    ProductListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          type: object
          required:
            - page
            - limit
            - totalItems
            - totalPages
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
            totalItems:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_id:
              value:
                message: "Validation failed"
                code: "BAD_REQUEST"
                details:
                  productId: "Must be a valid 24-hex MongoDB ObjectId"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            product_not_found:
              value:
                message: "Product not found"
                code: "NOT_FOUND"

x-database:
  provider: mongodb
  notes:
    - Product _id fields follow MongoDB ObjectId format
    - Query filters are designed for document-based search
